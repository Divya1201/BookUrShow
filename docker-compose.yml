# Whole system on one machine:   docker compose up --build
# Infrastructure only (run services from your IDE):   docker compose up mysql redis kafka rabbitmq localstack

x-service-env: &service-env
  DB_HOST: mysql
  DB_USER: ticket
  DB_PASSWORD: ticket123
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP: kafka:9092
  RABBITMQ_HOST: rabbitmq
  AWS_ENDPOINT: http://localstack:4566
  JWT_SECRET: change-me-to-a-long-random-secret-of-32-chars-min

x-depends-on-infra: &depends-on-infra
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  # ---------------- Infrastructure ----------------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0   # KRaft mode, no ZooKeeper needed
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # Containers use kafka:9092, apps running on your laptop use localhost:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]   # UI at http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  localstack:
    # Pinned: newer LocalStack images may require a (free) auth token. See README if this tag stops working.
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics | grep -q booking-notifications"]
      interval: 5s
      retries: 30

  # ---------------- Microservices ----------------
  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      <<: *service-env
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
    depends_on: [user-service, catalog-service, booking-service, payment-service]

  user-service:
    build: { context: ., args: { SERVICE: user-service } }
    ports: ["8081:8081"]
    environment: *service-env
    depends_on:
      mysql:
        condition: service_healthy

  catalog-service:
    build: { context: ., args: { SERVICE: catalog-service } }
    ports: ["8082:8082"]
    environment: *service-env
    depends_on: *depends-on-infra

  booking-service:
    build: { context: ., args: { SERVICE: booking-service } }
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      CATALOG_SERVICE_URL: http://catalog-service:8082
    depends_on: *depends-on-infra

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    ports: ["8084:8084"]
    environment: *service-env
    depends_on:
      <<: *depends-on-infra
      localstack:
        condition: service_healthy

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    ports: ["8085:8085"]
    environment: *service-env
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  mysql-data:
