server:
  port: 8083
  error:
    include-message: always   # return our "seat already held" style messages to clients

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/bookingdb?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ticket}
    password: ${DB_PASSWORD:ticket123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ticketbooking.common.events

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}

booking:
  seat-hold-duration: PT5M
  expiry-check-interval: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info
