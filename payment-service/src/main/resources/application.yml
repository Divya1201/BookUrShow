server:
  port: 8084
  error:
    include-message: always   # return our "seat already held" style messages to clients

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/paymentdb?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ticket}
    password: ${DB_PASSWORD:ticket123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ticketbooking.common.events
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      # LocalStack locally. On real AWS, remove this line and use IAM roles instead of keys.
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}

payment:
  retry-queue: payment-retry-queue
  retry-delay-seconds: 10
  max-attempts: 3
  mock:
    timeout-rate: 0.15   # 15% of attempts time out -> retried via SQS
    decline-rate: 0.10   # 10% of attempts are declined -> booking cancelled

management:
  endpoints:
    web:
      exposure:
        include: health,info
