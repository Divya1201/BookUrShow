# Application services. Build and load the images first: see scripts/build-images.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticket-booking
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: ticket-booking/api-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          # Spring Boot exposes these probe endpoints automatically when it detects Kubernetes
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36   # allow up to 3 minutes for startup
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: ticket-booking }
spec:
  type: NodePort   # reachable from your machine: minikube service api-gateway -n ticket-booking
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
